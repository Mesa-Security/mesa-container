# docker-compose.hub.yml
# Use Docker Hub images instead of local builds

services:
  mesa-frontend:
    image: shubhammesa/mesa-frontend:latest
    # If image isn't multi-arch and you're on Apple Silicon, uncomment:
    # platform: linux/arm64/v8
    container_name: mesa-frontend
    ports:
      - "3000:80"
    networks:
      - mesa-network
    depends_on:
      - mesa-backend
    restart: unless-stopped
    pull_policy: always

  mesa-backend:
    image: shubhammesa/mesa-backend:latest
    container_name: mesa-backend
    environment:
      TYPEORM_DATA_SOURCE: /app/dist/db/typeorm.config.js
    env_file:
      - ../mesa-backend/.env
    ports:
      - "3003:3003"
    networks:
      - mesa-network
    restart: unless-stopped
    pull_policy: always

  mesa-redis:
    image: redis:alpine
    container_name: mesa-redis
    ports:
      - "6379:6379"
    networks:
      - mesa-network
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: mesa-nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - mesa-network
    depends_on:
      - mesa-frontend
      - mesa-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    configs:
      - source: nginx-config
        target: /etc/nginx/nginx.conf
    labels:
      - "traefik.enable=false"

volumes:
  redis-data:
    driver: local

networks:
  mesa-network:
    driver: bridge

configs:
  nginx-config:
    content: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log notice;
      pid /var/run/nginx.pid;

      events {
          worker_connections 1024;
          use epoll;
          multi_accept on;
      }

      http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          log_format main '$$remote_addr - $$remote_user [$$time_local] "$$request" '
                          '$$status $$body_bytes_sent "$$http_referer" '
                          '"$$http_user_agent" "$$http_x_forwarded_for"';

          access_log /var/log/nginx/access.log main;

          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 65;
          types_hash_max_size 4096;
          client_max_body_size 100M;

          gzip on;
          gzip_vary on;
          gzip_min_length 1000;
          gzip_comp_level 6;
          gzip_types
              application/javascript
              application/json
              application/xml
              text/css
              text/javascript
              text/plain
              text/xml;

          limit_req_zone $$binary_remote_addr zone=api:10m rate=10r/s;
          limit_req_zone $$binary_remote_addr zone=auth:10m rate=5r/m;

          upstream mesa-frontend {
              server mesa-frontend:80;
              keepalive 32;
          }

          upstream mesa-backend {
              server mesa-backend:3003;
              keepalive 32;
          }

          server {
              listen 80;
              listen [::]:80;
              server_name _;

              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;
              server_tokens off;

              location /health {
                  access_log off;
                  return 200 "Mesa Stack Healthy\n";
                  add_header Content-Type text/plain;
              }

              location /api/ {
                  limit_req zone=api burst=20 nodelay;
                  proxy_pass http://mesa-backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_cache_bypass $$http_upgrade;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }

              location /auth/ {
                  limit_req zone=auth burst=5 nodelay;
                  proxy_pass http://mesa-backend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_connect_timeout 30s;
                  proxy_send_timeout 30s;
                  proxy_read_timeout 30s;
              }

              location /socket.io/ {
                  proxy_pass http://mesa-backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$$ {
                  proxy_pass http://mesa-frontend;
                  proxy_set_header Host $$host;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
                  access_log off;
              }

              location / {
                  proxy_pass http://mesa-frontend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
                  proxy_intercept_errors on;
                  error_page 404 = @fallback;
              }

              location @fallback {
                  proxy_pass http://mesa-frontend;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }
          }
      }